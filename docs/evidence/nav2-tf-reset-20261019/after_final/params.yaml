amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    always_reset_initial_pose: false
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
      z: 0.0
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.05
    laser_model_type: likelihood_field
    max_beams: 90
    max_particles: 1500
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    scan_topic: /sim/scan
    set_initial_pose: true
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.08
    update_min_d: 0.05
    use_sim_time: true
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors/BackUp
    behavior_plugins:
    - spin
    - backup
    - wait
    costmap_topic: local_costmap/costmap_raw
    cycle_frequency: 10.0
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    max_rotational_vel: 0.6
    min_rotational_vel: 0.15
    robot_base_frame: base_footprint
    rotational_acc_lim: 1.5
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors/Spin
    transform_tolerance: 0.5
    use_sim_time: true
    wait:
      plugin: nav2_behaviors/Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 50
    default_server_timeout: 100
    global_frame: map
    odom_topic: /sim/odom
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - nav2_is_battery_charging_condition_bt_node
    robot_base_frame: base_footprint
    use_sim_time: true
    wait_for_service_timeout: 1000
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 0.6
      cost_scaling_dist: 0.45
      cost_scaling_gain: 1.0
      desired_linear_vel: 0.3
      inflation_cost_scaling_factor: 4.0
      lookahead_dist: 0.6
      lookahead_time: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.5
      max_angular_accel: 1.5
      max_lookahead_dist: 0.8
      min_approach_linear_velocity: 0.05
      min_lookahead_dist: 0.3
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.5
      transform_tolerance: 0.5
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      use_interpolation: true
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: true
    bond_heartbeat_period: 0.0
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 0.5
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    odom_topic: /sim/odom
    progress_checker:
      movement_time_allowance: 12.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
    progress_checker_plugin: progress_checker
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint_padding: 0.02
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          obstacle_max_range: 9.0
          obstacle_min_range: 0.05
          raytrace_max_range: 12.0
          raytrace_min_range: 0.05
          topic: /sim/scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_footprint
      robot_radius: 0.35
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      transform_tolerance: 0.5
      update_frequency: 1.0
      use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.14, -0.16], [0.25, -0.16], [0.25, 0.16], [-0.14, 0.16]]'
      footprint_padding: 0.02
      global_frame: odom
      height: 4
      inflation_layer:
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          obstacle_max_range: 9.0
          obstacle_min_range: 0.05
          raytrace_max_range: 12.0
          raytrace_min_range: 0.05
          topic: /sim/scan
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      transform_tolerance: 0.5
      update_frequency: 5.0
      use_sim_time: true
      width: 4
map_saver:
  ros__parameters:
    free_thresh_default: 0.25
    map_subscribe_transient_local: true
    occupied_thresh_default: 0.65
    save_map_timeout: 5.0
    use_sim_time: true
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.2
      use_astar: true
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    use_sim_time: true
robot_state_publisher:
  ros__parameters:
    use_sim_time: true
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    use_sim_time: true
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: CLOSED_LOOP
    max_accel:
    - 0.5
    - 0.0
    - 1.5
    max_decel:
    - -0.5
    - 0.0
    - -1.5
    max_velocity:
    - 0.3
    - 0.0
    - 0.8
    min_velocity:
    - -0.15
    - 0.0
    - -0.8
    odom_duration: 0.1
    odom_topic: /sim/odom
    scale_velocities: false
    smoothing_frequency: 20.0
    use_sim_time: true
    velocity_timeout: 0.3
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    use_sim_time: true
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 0
    waypoint_task_executor_plugin: wait_at_waypoint
