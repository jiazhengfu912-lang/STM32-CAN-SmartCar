[platformio]
default_envs = esp32dev
src_dir = ../..
build_dir = ../../out/esp32
libdeps_dir = ../../out/esp32_libdeps

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = pre:configure.py
build_src_filter = -<*> +<firmware/esp32_gateway/src/main.cpp> +<firmware/esp32_gateway/cache_store.c> +<firmware/esp32_gateway/control_datagram.c> +<firmware/esp32_gateway/ota_sender.c> +<firmware/stm32_bootloader/boot_guard.c> +<protocol/car_protocol.c>
build_flags = -I../../protocol -I../stm32_bootloader -DCORE_DEBUG_LEVEL=0
